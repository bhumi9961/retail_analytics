[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-analytics"
version = "0.1.0"
description = "Tested ETL pipeline and analytics app for the Olist Brazilian e-commerce dataset"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.1,<3",
    "SQLAlchemy>=2.0,<3",
    "PyMySQL>=1.1,<2",
    "cryptography>=41",      # needed by PyMySQL for MySQL 8 default auth
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "db: tests that need the MySQL database running (docker compose up -d)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
